<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshSip | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="container">
  <div class="login-box">
    <div class="login-logo">🍹</div>
    <h1>FreshSip</h1>
    <p class="text-muted">Welcome back!</p>
    <form onsubmit="login(event)">
      <label class="form-label text-start w-100">Email</label>
      <input type="email" class="form-control mb-3" placeholder="Enter your email" required>
      <label class="form-label text-start w-100">Password</label>
      <input type="password" class="form-control mb-3" placeholder="Enter your password" required>
      <button class="btn btn-success w-100 btn-lg">Login</button>
    </form>
    <a href="index.html" class="d-block mt-3 text-success">Continue as guest</a>
  </div>
</div>
<script>
function login(e){e.preventDefault(); alert('Demo login successful!'); window.location.href='index.html';}
</script>
</body></html>
